# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# 进程内编译，避免 "Could not connect to Kotlin compile daemon" 错误
kotlin.compiler.execution.strategy=in-process
# 强制 Gradle 守护进程使用完整 JDK（IDE 默认的 redhat.java JRE 缺少 jlink，导致
# assembleDebug 的 JdkImageTransform 失败：jlink.exe does not exist）
# 注意：本机只有 jdk-21.0.12 / latest，不要填不存在的路径（如 jdk-17）
org.gradle.java.home=C:/Program Files/Java/jdk-21.0.12
